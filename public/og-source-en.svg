    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- top hairline -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="#C9BBA4" stroke-width="1" />
  <line x1="80" y1="550" x2="1120" y2="550" stroke="#C9BBA4" stroke-width="1" />

  <!-- top-left coords -->
  <text x="80" y="60" font-family="Georgia, serif" font-size="14" fill="#4A3F35" letter-spacing="2.5">
